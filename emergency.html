<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emergency — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="emergency-content">
  <div class="mb-4"><span class="eyebrow">Emergency</span>
    <h1 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--canvas-heading);margin:.25rem 0 0;">Contacts &amp; evacuation centers</h1></div>
  <div class="rain-card rain-card-dark reveal-on-scroll mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3" style="background:linear-gradient(160deg, rgba(216,57,74,.3), transparent), linear-gradient(160deg, var(--navy-800), var(--navy-950) 75%); border-color:rgba(216,57,74,.35);">
    <div>
      <div class="card-eyebrow" style="margin-bottom:.4rem;"><span>Active threat nearby?</span></div>
      <div style="font-family:var(--font-display); font-weight:700; font-size:1.15rem;">Switch to Emergency Mode for a simplified, action-only view.</div>
    </div>
    <button type="button" class="btn-emergency" style="width:auto;" id="activateEmergencyBtn" data-press><i class="bi bi-broadcast dicon" data-dicon="broadcast"></i> ACTIVATE EMERGENCY MODE</button>
  </div>

  <div class="rain-card reveal-on-scroll mb-4">
    <div class="card-eyebrow"><span>Emergency Contacts</span></div>
    <div class="row g-3" id="contactGrid"></div>
  </div>

  <div class="rain-card reveal-on-scroll" id="evac">
    <div class="card-eyebrow"><span>Evacuation Centers</span><span class="demo-data-tag" style="background:var(--accent-cyan-ink); color:#fff;">Source: Tanauan City CDRRMO</span></div>
    <div class="d-flex align-items-center gap-2 mb-3" id="evacLocNote" style="font-size:.78rem; color:var(--ink-400);"></div>
    <div class="map-filter-row mb-3" id="evacFilters">
      <button class="map-filter-btn light active" data-filter="all">All</button>
      <button class="map-filter-btn light" data-filter="shelter"><span class="legend-dot dot-shelter"></span> Shelters &amp; Schools (<span id="shelterCount">0</span>)</button>
      <button class="map-filter-btn light" data-filter="barangay"><span class="legend-dot" style="background:#7c3aed;"></span> Barangay Halls (<span id="brgyCount">0</span>)</button>
    </div>
    <div class="mb-2" style="font-size:.75rem; color:var(--ink-400);">
      <span class="legend-dot dot-shelter" style="vertical-align:middle;"></span> Shelter / school
      &nbsp;&nbsp;<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#7c3aed;border:2px solid #fff;box-shadow:0 0 0 1px #7c3aed;vertical-align:middle;"></span> Verified hall pin
      &nbsp;&nbsp;<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ddd6fe;border:2px dashed #7c3aed;vertical-align:middle;"></span> Approximate (barangay centre — not a confirmed hall)
    </div>
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
      <button type="button" class="map-filter-btn light" id="boundaryToggle" disabled><span class="legend-dot" style="background:#ec4899;"></span> Barangay boundaries</button>
      <button type="button" class="map-filter-btn light" id="lineModeBtn" disabled><i class="bi bi-bounding-box"></i> Boundary lines mode</button>
      <button type="button" class="map-filter-btn light" id="svModeBtn"><i class="bi bi-signpost-2"></i> Street view: click map</button>
      <span id="boundaryNote" style="font-size:.75rem; color:var(--ink-400);">Loading boundaries…</span>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-6"><select id="brgySelect" class="form-select form-select-sm" aria-label="Find a barangay hall"><option value="">Find a barangay hall…</option></select></div>
      <div class="col-12 col-md-6"><select id="shelterSelect" class="form-select form-select-sm" aria-label="Find a shelter or school"><option value="">Find a shelter or school…</option></select></div>
    </div>
    <div class="map-frame mb-3"><div id="evac-map"></div></div>
    <div id="svPanel" class="sv-panel mb-3" hidden>
      <div class="sv-head">
        <div><i class="bi bi-signpost-2"></i> <strong id="svTitle">Street view</strong> <span id="svCoords" class="text-muted-rain" style="font-size:.75rem;"></span></div>
        <div class="d-flex gap-2">
          <a id="svExternal" class="btn-rain btn-rain-ghost btn-rain-sm" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> Google Maps</a>
          <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" id="svSizeBtn"><i class="bi bi-arrows-expand"></i> Larger</button>
          <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" id="svClose"><i class="bi bi-x-lg"></i> Close</button>
        </div>
      </div>
      <iframe id="svFrame" title="Street view" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="sv-foot" id="svNote"></div>
    </div>
    <div class="d-flex flex-column gap-3" id="evacList"></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="assets/js/rain-map-layers.js"></script>
<script src="assets/js/rain-boundaries.js"></script>
<script src="assets/js/tanauan-boundaries.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await RainAuth.init();
  // CARTO Basemaps API key — required since CARTO deprecated anonymous
  // keyless raster tile access (tiles otherwise render stamped "API KEY
  // REQUIRED"). Like a Mapbox access token, this is meant to ship in
  // client-side code and isn't a secret that needs server-side hiding.
  const CARTO_API_KEY = "cb1_3qde_1_313d908e961a073e7e5de450";
  // Street view: paste a Google Maps Embed API key here for the official embed (Maps Embed API is free to use).
  // Leave it empty to use Google's keyless street-view embed, which Google may limit or change.
  const GOOGLE_MAPS_KEY = "";
  const user = renderAppShell("emergency.html", { title: "Emergency" });

  // 48 Tanauan City barangay halls — data lives in assets/js/demo-data.js (RAIN_DEMO.barangays).
  const BARANGAYS = RAIN_DEMO.barangays || [];

  // haversineKm() now lives in assets/js/main.js — shared across pages.
  function initEmergencyPage() {
    document.getElementById("app-content").appendChild(document.getElementById("emergency-content").content.cloneNode(true));

    document.getElementById("activateEmergencyBtn").addEventListener("click", () => RainEmergencyMode.open());

    const contactGrid = document.getElementById("contactGrid");
    const iconMap = {
      Police: "bi-shield-lock", Fire: "bi-fire", Medical: "bi-heart-pulse", NDRRMC: "bi-diagram-3",
      CDRRMO: "bi-diagram-3", Traffic: "bi-cone-striped", "Coast Guard": "bi-life-preserver",
    };
    // Emergency contacts don't change often, but save them anyway so the
    // "SOS" quick-dial numbers are guaranteed available offline even if a
    // resident never scrolls this page before losing connection.
    RainOffline.save("emergencyContacts", RAIN_DEMO.emergencyContacts);
    // One card per agency; one tap-to-call button per number (opens the phone's dialer).
    RAIN_DEMO.emergencyContacts.forEach((c) => {
      const nums = c.numbers || [c.number];
      const col = document.createElement("div");
      col.className = "col-12 col-sm-6 col-lg-4";
      col.innerHTML = `
        <div class="text-center p-3 h-100" style="border:1px solid var(--surface-line); border-radius:14px;">
          <i class="bi ${iconMap[c.tag] || "bi-telephone"} fs-3 mb-2" style="color:var(--status-critical);"></i>
          <div style="font-size:.85rem; font-weight:600; color:var(--ink-600); margin-bottom:.6rem;">${c.name}</div>
          <div class="d-flex flex-column gap-2">
            ${nums.map((n) => `<a href="tel:${n.replace(/[^\d+]/g, "")}" class="btn-emergency" data-press><i class="bi bi-telephone-fill"></i> CALL ${n}</a>`).join("")}
          </div>
        </div>`;
      contactGrid.appendChild(col);
    });

    // Fallback used only if the browser has no geolocation support, the user
    // denies the permission prompt, or the request times out — same pattern
    // and demo point (Tanauan City, Batangas) as dashboard.html. Never presented as
    // if it were the user's real GPS reading.
    const FALLBACK_LAT = 14.0863, FALLBACK_LNG = 121.1497;
    let evacMap = null;

    // Category → marker icon + list badge label. Shelters & schools use this;
    // barangay halls are drawn separately as purple circle markers.
    const CATEGORY_META = {
      shelter: { icon: "bi-house-heart-fill", label: "Shelter" },
    };

    // HTML for a "Street view" button inside a Leaflet popup (handled by a delegated click listener).
    function svButton(lat, lng, name) {
      return `<a href="#" onclick="return false;" data-sv-lat="${lat}" data-sv-lng="${lng}" data-sv-name="${String(name).replace(/"/g, "&quot;")}"><i class="bi bi-signpost-2"></i> Street view</a>`;
    }

    function renderEvacSection(userLat, userLng, isRealLocation) {
      const locNote = document.getElementById("evacLocNote");
      const offlineSuffix = RainOffline.isOnline() ? "" : ` <span class="cached-data-tag"><i class="bi bi-cloud-slash"></i> Offline</span>`;
      locNote.innerHTML = (isRealLocation
        ? `<i class="bi bi-geo-alt-fill" style="color:var(--accent-cyan);"></i> Distances are from your current location.`
        : `<i class="bi bi-geo-alt"></i> GPS unavailable — showing distances from Tanauan City, Batangas. <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" id="retryLocationBtn" style="padding:.1rem .6rem; margin-left:.3rem;">Enable location</button>`) + offlineSuffix;
      if (!isRealLocation) {
        document.getElementById("retryLocationBtn").addEventListener("click", requestLocation);
      }

      if (evacMap) evacMap.remove(); // re-render (e.g. after "Enable location") needs a fresh Leaflet instance on the same container
      const map = L.map("evac-map").setView([userLat, userLng], 12);
      evacMap = map;
      const baseTiles = L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`, { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>', maxZoom: 20 }).addTo(map);
      RainMapLayers.attach(map, { base: baseTiles, baseName: "Default" });
      L.marker([userLat, userLng], { icon: rainPinIcon("user", "bi-person-fill"), title: "You are here" })
        .addTo(map)
        .bindPopup(isRealLocation ? "Your location" : "Approximate location (GPS unavailable — showing Tanauan City, Batangas)");

      const evacList = document.getElementById("evacList");
      evacList.innerHTML = "";
      const categoryLayers = { shelter: L.layerGroup(), barangay: L.layerGroup() };
      const listItemsByCategory = { shelter: [], barangay: [] };

      // Barangay hall markers. Solid purple = hall pin; dashed pale = approximate
      // (district centre / administrative zone, not a confirmed hall location).
      const brgySelect = document.getElementById("brgySelect");
      brgySelect.innerHTML = '<option value="">Find a barangay hall…</option>';
      const brgyMarkers = [];
      BARANGAYS.forEach((b, i) => {
        const style = b.approx
          ? { radius: 8, color: "#7c3aed", weight: 2, dashArray: "3 3", fillColor: "#ddd6fe", fillOpacity: 0.7 }
          : { radius: 8, color: "#ffffff", weight: 2, fillColor: "#7c3aed", fillOpacity: 0.95 };
        const m = L.circleMarker([b.lat, b.lng], style)
          .addTo(categoryLayers.barangay)
          .bindTooltip(b.name + (b.approx ? " (approx.)" : ""), { direction: "top" })
          .bindPopup(
            `<strong>Brgy. ${b.name}</strong><br>${b.hall}` +
            (b.approx ? `<br><em style="color:#b45309;">Approximate — barangay centre, not a confirmed hall pin.</em>` : "") +
            `<br>${b.lat.toFixed(4)}° N, ${b.lng.toFixed(4)}° E` +
            `<br><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?to=${b.lat},${b.lng}">Directions</a>` +
            ` · ${svButton(b.lat, b.lng, "Brgy. " + b.name + " hall")}`
          );
        brgyMarkers.push(m);
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = b.name + (b.approx ? " (approx.)" : "");
        brgySelect.appendChild(opt);
      });
      // Jump to a barangay from the dropdown: show the layer, zoom in, open its popup.
      document.getElementById("brgyCount").textContent = BARANGAYS.length;
      brgySelect.onchange = () => {
        if (brgySelect.value === "") return;
        const m = brgyMarkers[Number(brgySelect.value)];
        document.querySelector('#evacFilters [data-filter="barangay"]').click();
        map.flyTo(m.getLatLng(), 16, { duration: 0.8 });
        map.once("moveend", () => m.openPopup());
      };

      // Barangay boundary polygons (optional file — see assets/data/README.txt).
      const bBtn = document.getElementById("boundaryToggle");
      const bNote = document.getElementById("boundaryNote");
      bBtn.disabled = true; bBtn.classList.remove("active"); bNote.textContent = "Loading boundaries…";
      let lineLayer = null;
      // Real file if present; otherwise the generated APPROXIMATE zones (window.RAIN_ZONES).
      RainBoundaries.attach(map, null, { data: window.RAIN_BOUNDARIES }).then((res) => {
        if (res.error) {
          bNote.textContent = "Boundaries not loaded: " + res.error + " (see assets/data/README.txt)";
          return;
        }
        bBtn.disabled = false; bBtn.classList.add("active");
        bNote.textContent = res.count + " barangay boundaries (tanauan.gpkg)";
        try { map.fitBounds(res.layer.getBounds(), { padding: [10, 10] }); } catch (e) {}
        bBtn.onclick = () => {
          const on = map.hasLayer(res.layer);
          if (on) map.removeLayer(res.layer); else res.layer.addTo(map);
          bBtn.classList.toggle("active", !on);
          if (!on && lineLayer && map.hasLayer(lineLayer)) setLineMode(false); // fills back on => leave lines-only mode
        };

        // Boundary lines mode: outlines only (no colour fill), one line per barangay, name on hover.
        const lBtn = document.getElementById("lineModeBtn");
        const linePane = map.getPane("rain-lines") || map.createPane("rain-lines");
        linePane.style.zIndex = 360; // above the colour fills (350), below pins
        lineLayer = L.geoJSON(window.RAIN_BOUNDARIES, {
          pane: "rain-lines",
          style: { color: "#0f172a", weight: 2, opacity: 0.9, fill: false },
          onEachFeature: (f, l) => {
            l.bindTooltip(RainBoundaries._util.nameOf(f.properties), { sticky: true });
            l.on("mouseover", () => l.setStyle({ color: "#ec4899", weight: 4 }));
            l.on("mouseout", () => lineLayer.resetStyle(l));
          },
        });
        function setLineMode(on) {
          if (on) {
            if (map.hasLayer(res.layer)) map.removeLayer(res.layer);
            bBtn.classList.remove("active");
            lineLayer.addTo(map);
          } else if (map.hasLayer(lineLayer)) map.removeLayer(lineLayer);
          lBtn.classList.toggle("active", on);
        }
        lBtn.disabled = false;
        lBtn.onclick = () => setLineMode(!map.hasLayer(lineLayer));
      });

      const sortedCenters = RAIN_DEMO.evacuationCenters
        .map((c) => ({ ...c, dist: haversineKm(userLat, userLng, c.lat, c.lng) }))
        .sort((a, b) => a.dist - b.dist);

      // Snapshot the nearest-first list (with real distances) so the app
      // shell's offline reminder can name the closest evacuation center
      // even after this page is closed and the connection drops.
      RainOffline.save("evacuationCenters", sortedCenters);

      const shelterMarkers = [];
      sortedCenters.forEach((c) => {
          const cat = c.category || "shelter";
          const meta = CATEGORY_META[cat] || CATEGORY_META.shelter;

          const marker = L.marker([c.lat, c.lng], { icon: rainPinIcon(cat, meta.icon), title: c.name })
            .addTo(categoryLayers[cat])
            .bindPopup(`<strong>${c.name}</strong><br>${c.type || meta.label}<br>${c.address}` +
              `<br>${c.lat.toFixed(4)}° N, ${c.lng.toFixed(4)}° E` +
              `<br><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?to=${c.lat},${c.lng}">Directions</a> · ${svButton(c.lat, c.lng, c.name)}`);
          shelterMarkers.push({ marker, c });

          const el = document.createElement("div");
          el.className = "d-flex justify-content-between align-items-start gap-3 reveal-on-scroll";
          el.style.cssText = "border-bottom:1px solid var(--surface-line); padding-bottom:1rem;";
          el.innerHTML = `
            <div>
              <div style="font-weight:700; color:var(--navy-950);">${c.name}<span class="evac-type-badge ${cat}">${c.type || meta.label}</span></div>
              <div style="font-size:.85rem; color:var(--ink-600);">${c.address}</div>
              ${(c.contact || c.facilities) ? `<div style="font-size:.8rem; color:var(--ink-400);"><i class="bi bi-telephone"></i> ${[c.contact, c.facilities].filter(Boolean).join(" · ")}</div>` : ""}
            </div>
            <div class="text-end flex-shrink-0">
              <div style="font-weight:700; color:var(--accent-cyan);">${c.dist.toFixed(1)} km</div>
              <div class="d-flex flex-wrap gap-1 justify-content-end mt-1">
                <a class="btn-rain btn-rain-ghost btn-rain-sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?to=${c.lat},${c.lng}"><i class="bi bi-signpost-split"></i> Directions</a>
                <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" data-sv-lat="${c.lat}" data-sv-lng="${c.lng}" data-sv-name="${c.name.replace(/"/g, "&quot;")}"><i class="bi bi-signpost-2"></i> Street view</button>
              </div>
            </div>`;
          evacList.appendChild(el);
          listItemsByCategory[cat].push(el);
        });

      if (!sortedCenters.length) {
        evacList.innerHTML = '<p class="text-muted-rain mb-0">The evacuation center list from the Tanauan City CDRRMO is not available yet. Please contact the CDRRMO or your barangay hall for the nearest evacuation center.</p>';
      }

      document.getElementById("shelterCount").textContent = sortedCenters.length;
      const shelterSelect = document.getElementById("shelterSelect");
      shelterSelect.innerHTML = '<option value="">Find a shelter or school…</option>';
      shelterMarkers.forEach(({ c }, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = c.name + " (" + c.dist.toFixed(1) + " km)";
        shelterSelect.appendChild(opt);
      });
      shelterSelect.onchange = () => {
        if (shelterSelect.value === "") return;
        const m = shelterMarkers[Number(shelterSelect.value)].marker;
        document.querySelector('#evacFilters [data-filter="shelter"]').click();
        map.flyTo(m.getLatLng(), 17, { duration: 0.8 });
        map.once("moveend", () => m.openPopup());
      };

      // ---- Street view (Google) — opens from any popup / list button, or by clicking the map in "click map" mode.
      const svPanel = document.getElementById("svPanel"), svFrame = document.getElementById("svFrame");
      const svModeBtn = document.getElementById("svModeBtn");
      let svMarker = null, svMode = false;
      function svSrc(lat, lng) {
        return GOOGLE_MAPS_KEY
          ? `https://www.google.com/maps/embed/v1/streetview?key=${GOOGLE_MAPS_KEY}&location=${lat},${lng}&fov=90`
          : `https://maps.google.com/maps?layer=c&cbll=${lat},${lng}&cbp=11,0,0,0,0&output=svembed`;
      }
      function openStreetView(lat, lng, name, place) {
        svPanel.hidden = false;
        document.getElementById("svTitle").textContent = name || "Street view";
        document.getElementById("svCoords").textContent = lat.toFixed(5) + ", " + lng.toFixed(5);
        document.getElementById("svExternal").href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
        document.getElementById("svNote").textContent = RainOffline.isOnline()
          ? "No imagery here? Drag the pin (click-map mode) to a nearby road, or use the Google Maps link."
          : "You are offline — street view needs an internet connection.";
        svFrame.src = svSrc(lat, lng);
        if (place !== false) {
          if (!svMarker) {
            svMarker = L.marker([lat, lng], { draggable: true, icon: rainPinIcon("user", "bi-signpost-2"), title: "Street view point (drag me)", zIndexOffset: 1000 }).addTo(map);
            svMarker.on("dragend", () => { const p = svMarker.getLatLng(); openStreetView(p.lat, p.lng, "Dropped pin", false); });
          } else svMarker.setLatLng([lat, lng]);
        }
        svPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
      function closeStreetView() {
        svPanel.hidden = true; svFrame.src = "about:blank";
        if (svMarker) { map.removeLayer(svMarker); svMarker = null; }
        setSvMode(false);
      }
      function setSvMode(on) {
        svMode = on; svModeBtn.classList.toggle("active", on);
        map.getContainer().style.cursor = on ? "crosshair" : "";
      }
      svModeBtn.onclick = () => setSvMode(!svMode);
      document.getElementById("svClose").onclick = closeStreetView;
      document.getElementById("svSizeBtn").onclick = (ev) => {
        const big = svPanel.classList.toggle("sv-large");
        ev.currentTarget.innerHTML = big ? '<i class="bi bi-arrows-collapse"></i> Smaller' : '<i class="bi bi-arrows-expand"></i> Larger';
      };
      map.on("click", (ev) => { if (svMode) openStreetView(ev.latlng.lat, ev.latlng.lng, "Dropped pin"); });
      // popup buttons (created as HTML strings) and list buttons
      const svHandler = (ev) => {
        const t = ev.target.closest("[data-sv-lat]");
        if (!t) return;
        openStreetView(Number(t.dataset.svLat), Number(t.dataset.svLng), t.dataset.svName);
      };
      map.getContainer().addEventListener("click", svHandler);
      evacList.addEventListener("click", svHandler);

      Object.values(categoryLayers).forEach((layer) => layer.addTo(map));

      document.querySelectorAll("#evacFilters .map-filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#evacFilters .map-filter-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const f = btn.dataset.filter;
          Object.entries(categoryLayers).forEach(([cat, layer]) => {
            const show = f === "all" || f === cat;
            if (show && !map.hasLayer(layer)) layer.addTo(map);
            else if (!show && map.hasLayer(layer)) map.removeLayer(layer);
            listItemsByCategory[cat].forEach((el) => { el.style.display = show ? "" : "none"; });
          });
          // Zoom out to show every barangay hall when that filter is chosen.
          if (f === "barangay" && BARANGAYS.length) {
            map.fitBounds(L.latLngBounds(BARANGAYS.map((b) => [b.lat, b.lng])), { padding: [30, 30] });
          } else if (f === "shelter" && sortedCenters.length) {
            map.fitBounds(L.latLngBounds(sortedCenters.map((c) => [c.lat, c.lng])), { padding: [30, 30] });
          }
        });
      });

      initializeAnimations();
      setTimeout(() => map.invalidateSize(), 200);
    }

    // Resolve the user's real location before drawing the map/list, so the
    // "km away" figures reflect where they actually are, not a fixed demo
    // point. Falls back to Tanauan City, Batangas if geolocation is unsupported,
    // denied, or times out (see FALLBACK_LAT/LNG above).
    function requestLocation() {
      const locNote = document.getElementById("evacLocNote");
      locNote.innerHTML = `<i class="bi bi-geo-alt"></i> Locating you…`;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => renderEvacSection(pos.coords.latitude, pos.coords.longitude, true),
          () => renderEvacSection(FALLBACK_LAT, FALLBACK_LNG, false),
          { timeout: 8000 }
        );
      } else {
        renderEvacSection(FALLBACK_LAT, FALLBACK_LNG, false);
      }
    }
    requestLocation();
  }

  if (user) initEmergencyPage();
</script>
</body>
</html>
